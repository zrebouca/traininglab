<script>
// ===================== ESTADO E LÃ“GICA =====================
const STORAGE_KEY = 'cdc-quiz-state-v1';
const LOCK_KEY = 'cdc-quiz-completed-v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function isLocked() {
  try { return localStorage.getItem(LOCK_KEY) === '1'; } catch(e) { return false; }
}
function setLocked() {
  try { localStorage.setItem(LOCK_KEY, '1'); } catch(e) {}
}
function fallbackCopy(text){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);return true;}catch(e){return false;}}

let state = loadState() || { current: -1, score: 0, streak: 0, bestStreak: 0, correctCount: 0, answers: [], finished: false };

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render() {
  const root = document.getElementById('root');

  if (isLocked() && !state.finished) {
    root.innerHTML = renderLockedScreen();
    return;
  }

  if (state.current === -1) {
    root.innerHTML = renderIntro();
    document.getElementById('start-btn').addEventListener('click', startQuiz);
    return;
  }

  if (state.finished || state.current >= QUESTIONS.length) {
    root.innerHTML = renderFinal();
    const copyBtn = document.getElementById('copy-score-btn');
    if (copyBtn) copyBtn.addEventListener('click', function(){
      const txt = 'ConcluÃ­ o Desafio CDC â€” Cliente DifÃ­cil com ' + state.score + ' pontos (' + state.correctCount + '/' + QUESTIONS.length + ' corretas)! ðŸ¦‰';
      navigator.clipboard ? navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt)) : fallbackCopy(txt);
      copyBtn.textContent = 'âœ“ Copiado!';
      setTimeout(()=>{copyBtn.textContent = 'ðŸ“‹ Copiar resumo para enviar no Chime';}, 1800);
    });
    return;
  }

  root.innerHTML = renderQuestion();
  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', function(){ answerQuestion(+this.dataset.idx); });
  });
}

function renderIntro() {
  return `
    <div class="center">
      <div class="emoji-big">ðŸ¦‰âš–ï¸</div>
      <h1 style="justify-content:center">Desafio: Cliente DifÃ­cil & CDC</h1>
      <p class="sub">Teste seus conhecimentos sobre como lidar com clientes que citam o CDC de forma incorreta, ameaÃ§am processar, ou tentam pressionar por soluÃ§Ãµes fora da polÃ­tica.</p>
    </div>
    <ul class="rules-list">
      <li>${QUESTIONS.length} perguntas baseadas em situaÃ§Ãµes reais de atendimento</li>
      <li>PontuaÃ§Ã£o estilo Kahoot: 10 ou 15 pts por questÃ£o + bÃ´nus de sequÃªncia</li>
      <li>VocÃª tem apenas <b>1 tentativa</b> â€” responda com atenÃ§Ã£o!</li>
      <li>Ao final, vocÃª recebe um selo de desempenho e pode registrar seu score</li>
    </ul>
    <button class="btn" id="start-btn">ðŸš€ ComeÃ§ar o Desafio</button>
  `;
}

function renderLockedScreen() {
  return `
    <div class="center">
      <div class="emoji-big">ðŸ”’</div>
      <h1 style="justify-content:center">Desafio jÃ¡ concluÃ­do</h1>
    </div>
    <div class="locked-box">
      VocÃª jÃ¡ completou este desafio anteriormente. Cada pessoa tem direito a apenas <b>1 tentativa</b> para manter a competiÃ§Ã£o justa.<br><br>
      Se vocÃª acredita que isso Ã© um engano, fale com seu TM.
    </div>
  `;
}

function renderQuestion() {
  const q = QUESTIONS[state.current];
  const pct = Math.round((state.current / QUESTIONS.length) * 100);
  const diffClass = q.difficulty >= 15 ? 'hard' : 'easy';
  const diffLabel = q.difficulty >= 15 ? 'ðŸ”¥ DifÃ­cil â€” 15 pts' : 'â­ PadrÃ£o â€” 10 pts';
  return `
    <div class="topline">
      <span>PERGUNTA ${state.current+1} DE ${QUESTIONS.length}</span>
      <span class="streak">ðŸ”¥ SequÃªncia: ${state.streak}</span>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
    <span class="q-badge ${diffClass}">${diffLabel}</span>
    <div class="q-text">${esc(q.q)}</div>
    ${q.opts.map((o,i) => `<button class="opt" data-idx="${i}">${esc(o)}</button>`).join('')}
  `;
}

function renderFeedback(q, chosenIdx, correct, pointsEarned) {
  const cls = correct ? 'ok' : 'no';
  const title = correct ? 'âœ… Correto!' : 'âŒ Incorreto';
  const pts = correct ? `+${pointsEarned} pontos` : '+0 pontos';
  return `
    <div class="feedback ${cls}">
      <b>${title}</b> â€” ${pts}<br><br>
      ${esc(q.explain)}
      <br><span class="ref">${esc(q.ref)}</span>
    </div>
    <button class="btn next-btn" id="next-btn">${state.current+1 >= QUESTIONS.length ? 'ðŸ Ver resultado final' : 'PrÃ³xima pergunta â†’'}</button>
  `;
}

function answerQuestion(idx) {
  const q = QUESTIONS[state.current];
  const correct = (idx === q.correct);
  let pointsEarned = 0;

  document.querySelectorAll('.opt').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
  });

  if (correct) {
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const streakBonus = Math.min(state.streak * 3, 15);
    pointsEarned = q.difficulty + streakBonus;
    state.score += pointsEarned;
    state.correctCount += 1;
  } else {
    state.streak = 0;
  }

  state.answers.push({ idx: state.current, chosen: idx, correct: correct });
  saveState(state);

  const root = document.getElementById('root');
  const fbDiv = document.createElement('div');
  fbDiv.innerHTML = renderFeedback(q, idx, correct, pointsEarned);
  root.appendChild(fbDiv);

  document.getElementById('next-btn').addEventListener('click', function(){
    state.current += 1;
    if (state.current >= QUESTIONS.length) {
      state.finished = true;
      setLocked();
    }
    saveState(state);
    render();
  });
}

function startQuiz() {
  state.current = 0;
  saveState(state);
  render();
}

  if (pct >= 80) return { key: 'expert', label: 'ðŸ† EXPERT EM CDC', reconhecimento: 15 };
  if (pct >= 50) return { key: 'intermediario', label: 'â­ INTERMEDIÃRIO', reconhecimento: 10 };

}

  return `
    <div class="center">
      <div class="emoji-big">ðŸ¦‰</div>
      <h1 style="justify-content:center">Desafio ConcluÃ­do!</h1>
      <div class="score-num">${state.score}</div>
      <div class="score-label">pontos de ${maxScore} possÃ­veis</div>
      <div class="badge-final ${badge.key}">${badge.label}</div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="num">${state.correctCount}/${total}</div><div class="lbl">ACERTOS</div></div>
      <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">APROVEITAMENTO</div></div>
      <div class="stat-box"><div class="num">${state.bestStreak}ðŸ”¥</div><div class="lbl">MELHOR SEQUÃŠNCIA</div></div>
    </div>
    <div class="reconhecimento-box">
      ðŸŽ <b>PrÃªmio reconhecimento:</b> com base no seu desempenho (${pct}%), vocÃª faz jus a <b>${badge.reconhecimento} minutos de reconhecimento</b>.<br><br>
      ðŸ“¸ Tire um print desta tela e envie para seu TM via Chime para receber o crÃ©dito.
    </div>
    <button class="btn secondary" id="copy-score-btn">ðŸ“‹ Copiar resumo para enviar no Chime</button>
  `;
}

render();
</script>
